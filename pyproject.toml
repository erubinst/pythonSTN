[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonSTN"
version = "0.1.0"
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "plotly"
]

[tool.setuptools]
packages = ["tds", "stn", "tds_slack"]
py-modules = ["executer"]